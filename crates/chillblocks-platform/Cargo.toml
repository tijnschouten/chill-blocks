[package]
name = "chillblocks-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chillblocks-ui = { path = "../chillblocks-ui" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3.106", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "CanvasRenderingContext2d",
    "Storage",
    "Performance",
    "AudioContext",
    "BaseAudioContext",
    "AudioNode",
    "AudioParam",
    "GainNode",
    "OscillatorNode",
    "AudioDestinationNode",
] }

[workspace]
resolver = "2"
members = [
    "crates/chillblocks-core",
    "crates/chillblocks-ui",
    "crates/chillblocks-platform",
    "crates/chillblocks-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
